name: Income Model CI/CD

on:
  push:
    branches: [main]
    paths:
      - 'data/**.dvc'
      - 'src/**.py'
      - 'params.yaml'
  workflow_dispatch:

jobs:
  unit-test:
    name: Unit Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run unit tests
        run: pytest tests/ -v

  train:
    name: Train
    needs: unit-test
    runs-on: ubuntu-latest
    outputs:
      f1: ${{ steps.read_report.outputs.f1 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Authenticate to AWS S3
        run: |
          CREDS='${{ secrets.STORAGE_CREDENTIALS }}'
          echo "AWS_ACCESS_KEY_ID=$(echo $CREDS | jq -r '.aws_access_key_id')" >> $GITHUB_ENV
          echo "AWS_SECRET_ACCESS_KEY=$(echo $CREDS | jq -r '.aws_secret_access_key')" >> $GITHUB_ENV
          echo "AWS_DEFAULT_REGION=ap-southeast-2" >> $GITHUB_ENV
      - name: Pull data with DVC
        run: dvc pull data/train_batch1.csv.dvc data/holdout.csv.dvc
      - name: Train model
        run: python src/train.py
      - name: Read report
        id: read_report
        run: |
          F1=$(python -c "import json; d=json.load(open('outputs/report.json')); print(d['f1_score'])")
          echo "f1=$F1" >> $GITHUB_OUTPUT
      - name: Upload model to S3
        run: |
          python - <<'PYEOF'
          import boto3
          bucket_name = "${{ secrets.ARTIFACT_BUCKET }}"
          s3 = boto3.client('s3')
          s3.upload_file("models/model.joblib", bucket_name, "artifacts/current/model.joblib")
          s3.upload_file("outputs/report.json", bucket_name, "artifacts/current/report.json")
          print("Uploaded model and report to S3.")
          PYEOF
      - name: Save report artifact
        uses: actions/upload-artifact@v4
        with:
          name: report
          path: |
            outputs/report.json
            outputs/detail.txt

  quality-gate:
    name: Quality Gate
    needs: train
    runs-on: ubuntu-latest
    steps:
      - name: Authenticate AWS
        run: |
          CREDS='${{ secrets.STORAGE_CREDENTIALS }}'
          echo "AWS_ACCESS_KEY_ID=$(echo $CREDS | jq -r '.aws_access_key_id')" >> $GITHUB_ENV
          echo "AWS_SECRET_ACCESS_KEY=$(echo $CREDS | jq -r '.aws_secret_access_key')" >> $GITHUB_ENV
          echo "AWS_DEFAULT_REGION=ap-southeast-2" >> $GITHUB_ENV
      - name: Check quality gate & Rollback Guard
        run: |
          python - <<'PYEOF'
          import sys, json, boto3
          from botocore.exceptions import ClientError

          f1 = float("${{ needs.train.outputs.f1 }}")
          F1_THRESHOLD = 0.65
          print(f"Current Model F1-Score: {f1:.4f}")
          if f1 < F1_THRESHOLD:
              sys.exit(f"FAILED: f1_score {f1:.4f} < {F1_THRESHOLD}. Huỷ triển khai.")

          bucket_name = "${{ secrets.ARTIFACT_BUCKET }}"
          s3 = boto3.client('s3')
          try:
              s3.download_file(bucket_name, "artifacts/previous/report.json", "/tmp/prev_report.json")
              with open("/tmp/prev_report.json") as f:
                  prev_data = json.load(f)
              prev_f1 = float(prev_data.get("f1_score", 0.0))
              print(f"[BONUS 4 ROLLBACK GUARD] Prev F1: {prev_f1:.4f} | New F1: {f1:.4f}")
              if f1 < prev_f1 - 0.05:
                  sys.exit(f"FAILED: F1 giảm nghiêm trọng ({f1:.4f} vs {prev_f1:.4f}).")
          except ClientError:
              print("[BONUS 4] First run. Skipping rollback comparison.")

          print("PASSED: Model đạt chất lượng.")
          PYEOF

  release:
    name: Release
    needs: quality-gate
    runs-on: ubuntu-latest
    steps:
      - name: SSH deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            sudo systemctl restart income-api
            sleep 5
            for i in {1..5}; do
              if curl -sf http://localhost:8080/healthz; then
                echo "Health check passed!"
                exit 0
              fi
              sleep 3
            done
            echo "Health check failed!"
            exit 1
