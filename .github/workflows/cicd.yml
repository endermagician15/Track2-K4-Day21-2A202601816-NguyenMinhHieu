name: Income Model CI/CD

on:
  push:
    branches: [main]
    paths:
      - 'data/**.dvc'
      - 'src/**.py'
      - 'params.yaml'
      - '.github/workflows/**'
      - 'requirements.txt'
  workflow_dispatch:

jobs:
  unit-test:
    name: Unit Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run unit tests
        run: pytest tests/ -v

  train:
    name: Train
    needs: unit-test
    runs-on: ubuntu-latest
    outputs:
      f1: ${{ steps.read_report.outputs.f1 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Authenticate to AWS S3
        env:
          STORAGE_CREDENTIALS: ${{ secrets.STORAGE_CREDENTIALS }}
          SECRET_AWS_KEY: ${{ secrets.AWS_ACCESS_KEY_ID }}
          SECRET_AWS_SECRET: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          python - <<'PYEOF'
          import json, os, sys

          creds_str = os.environ.get("STORAGE_CREDENTIALS", "").strip()
          key_id = os.environ.get("SECRET_AWS_KEY", "").strip()
          secret_key = os.environ.get("SECRET_AWS_SECRET", "").strip()

          if not key_id or not secret_key:
              try:
                  data = json.loads(creds_str)
                  if isinstance(data, dict):
                      for k, v in data.items():
                          if "access_key" in k.lower() and "secret" not in k.lower():
                              key_id = str(v).strip()
                          elif "secret" in k.lower():
                              secret_key = str(v).strip()
              except Exception:
                  pass

          if not key_id or not secret_key:
              lines = [l.strip() for l in creds_str.splitlines() if l.strip()]
              for line in lines:
                  if "=" in line:
                      k, v = line.split("=", 1)
                      if "access_key" in k.lower() and "secret" not in k.lower():
                          key_id = v.strip().strip('"').strip("'")
                      elif "secret" in k.lower():
                          secret_key = v.strip().strip('"').strip("'")
                  elif line.startswith("AKIA"):
                      key_id = line
                  elif len(line) >= 30 and not line.startswith("AKIA"):
                      secret_key = line

          if not key_id or not secret_key:
              print("=" * 60)
              print("[LỖI XÁC THỰC] Không tìm thấy AWS Access Key hoặc Secret Key trong GitHub Secrets!")
              print("Vui lòng vào Settings -> Secrets and variables -> Actions trên GitHub:")
              print("Tạo secret STORAGE_CREDENTIALS có dạng:")
              print('{"aws_access_key_id": "AKIA...", "aws_secret_access_key": "..."}')
              print("Hoặc tạo 2 secret riêng: AWS_ACCESS_KEY_ID và AWS_SECRET_ACCESS_KEY")
              print("=" * 60)
              sys.exit(1)

          print(f"-> Đã tìm thấy AWS Access Key ID: {key_id[:4]}**** (Độ dài secret: {len(secret_key)})")

          # Tạo file ~/.aws/credentials
          aws_dir = os.path.expanduser("~/.aws")
          os.makedirs(aws_dir, exist_ok=True)
          with open(os.path.join(aws_dir, "credentials"), "w") as f:
              f.write(f"[default]\naws_access_key_id = {key_id}\naws_secret_access_key = {secret_key}\n")
          with open(os.path.join(aws_dir, "config"), "w") as f:
              f.write("[default]\nregion = ap-southeast-2\noutput = json\n")

          # Đưa vào GITHUB_ENV
          with open(os.environ["GITHUB_ENV"], "a") as f:
              f.write(f"AWS_ACCESS_KEY_ID={key_id}\n")
              f.write(f"AWS_SECRET_ACCESS_KEY={secret_key}\n")
              f.write("AWS_DEFAULT_REGION=ap-southeast-2\n")
              f.write("AWS_REGION=ap-southeast-2\n")
              f.write("MLFLOW_TRACKING_URI=sqlite:///mlflow.db\n")
              f.write("MLFLOW_ARTIFACT_ROOT=./mlartifacts\n")
          PYEOF

      - name: Pull data with DVC
        run: |
          dvc remote modify labstore access_key_id "$AWS_ACCESS_KEY_ID"
          dvc remote modify labstore secret_access_key "$AWS_SECRET_ACCESS_KEY"
          dvc remote modify labstore region ap-southeast-2
          dvc pull data/train_batch1.csv.dvc data/holdout.csv.dvc

      - name: Train model
        run: python src/train.py

      - name: Read report
        id: read_report
        run: |
          F1=$(python -c "import json; d=json.load(open('outputs/report.json')); print(d['f1_score'])")
          echo "f1=$F1" >> $GITHUB_OUTPUT

      - name: Upload model to S3
        run: |
          python - <<'PYEOF'
          import boto3, os
          bucket_name = "${{ secrets.ARTIFACT_BUCKET }}"
          s3 = boto3.client(
              's3',
              aws_access_key_id=os.environ.get("AWS_ACCESS_KEY_ID"),
              aws_secret_access_key=os.environ.get("AWS_SECRET_ACCESS_KEY"),
              region_name="ap-southeast-2"
          )
          s3.upload_file("models/model.joblib", bucket_name, "artifacts/current/model.joblib")
          s3.upload_file("outputs/report.json", bucket_name, "artifacts/current/report.json")
          print("Uploaded model and report to S3.")
          PYEOF

      - name: Save report artifact
        uses: actions/upload-artifact@v4
        with:
          name: report
          path: |
            outputs/report.json
            outputs/detail.txt

  quality-gate:
    name: Quality Gate
    needs: train
    runs-on: ubuntu-latest
    steps:
      - name: Authenticate AWS
        env:
          STORAGE_CREDENTIALS: ${{ secrets.STORAGE_CREDENTIALS }}
          SECRET_AWS_KEY: ${{ secrets.AWS_ACCESS_KEY_ID }}
          SECRET_AWS_SECRET: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          python - <<'PYEOF'
          import json, os, sys

          creds_str = os.environ.get("STORAGE_CREDENTIALS", "").strip()
          key_id = os.environ.get("SECRET_AWS_KEY", "").strip()
          secret_key = os.environ.get("SECRET_AWS_SECRET", "").strip()

          if not key_id or not secret_key:
              try:
                  data = json.loads(creds_str)
                  if isinstance(data, dict):
                      for k, v in data.items():
                          if "access_key" in k.lower() and "secret" not in k.lower():
                              key_id = str(v).strip()
                          elif "secret" in k.lower():
                              secret_key = str(v).strip()
              except Exception:
                  pass

          if not key_id or not secret_key:
              lines = [l.strip() for l in creds_str.splitlines() if l.strip()]
              for line in lines:
                  if "=" in line:
                      k, v = line.split("=", 1)
                      if "access_key" in k.lower() and "secret" not in k.lower():
                          key_id = v.strip().strip('"').strip("'")
                      elif "secret" in k.lower():
                          secret_key = v.strip().strip('"').strip("'")
                  elif line.startswith("AKIA"):
                      key_id = line
                  elif len(line) >= 30 and not line.startswith("AKIA"):
                      secret_key = line

          with open(os.environ["GITHUB_ENV"], "a") as f:
              f.write(f"AWS_ACCESS_KEY_ID={key_id}\n")
              f.write(f"AWS_SECRET_ACCESS_KEY={secret_key}\n")
              f.write("AWS_DEFAULT_REGION=ap-southeast-2\n")
              f.write("AWS_REGION=ap-southeast-2\n")
          PYEOF

      - name: Check quality gate & Rollback Guard
        run: |
          python - <<'PYEOF'
          import sys, json, boto3, os
          from botocore.exceptions import ClientError

          f1 = float("${{ needs.train.outputs.f1 }}")
          F1_THRESHOLD = 0.65
          print(f"Current Model F1-Score: {f1:.4f}")
          if f1 < F1_THRESHOLD:
              sys.exit(f"FAILED: f1_score {f1:.4f} < {F1_THRESHOLD}. Huỷ triển khai.")

          bucket_name = "${{ secrets.ARTIFACT_BUCKET }}"
          s3 = boto3.client(
              's3',
              aws_access_key_id=os.environ.get("AWS_ACCESS_KEY_ID"),
              aws_secret_access_key=os.environ.get("AWS_SECRET_ACCESS_KEY"),
              region_name="ap-southeast-2"
          )
          try:
              s3.download_file(bucket_name, "artifacts/previous/report.json", "/tmp/prev_report.json")
              with open("/tmp/prev_report.json") as f:
                  prev_data = json.load(f)
              prev_f1 = float(prev_data.get("f1_score", 0.0))
              print(f"[BONUS 4 ROLLBACK GUARD] Prev F1: {prev_f1:.4f} | New F1: {f1:.4f}")
              if f1 < prev_f1 - 0.05:
                  sys.exit(f"FAILED: F1 giảm nghiêm trọng ({f1:.4f} vs {prev_f1:.4f}).")
          except ClientError:
              print("[BONUS 4] First run. Skipping rollback comparison.")

          print("PASSED: Model đạt chất lượng.")
          PYEOF

  release:
    name: Release
    needs: quality-gate
    runs-on: ubuntu-latest
    steps:
      - name: SSH deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            sudo systemctl restart income-api
            sleep 5
            for i in {1..5}; do
              if curl -sf http://localhost:8080/healthz; then
                echo "Health check passed!"
                exit 0
              fi
              sleep 3
            done
            echo "Health check failed!"
            exit 1
